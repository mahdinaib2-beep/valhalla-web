<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games & Accounts - Valhalla Web</title>
    <!-- ربط ملف الـ CSS الموحد -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* تفعيل التمرير السلس للصفحة */
        html {
            scroll-behavior: smooth;
        }

        /* تصميم البطاقات مع تأثير التكبير والتركيز عند التمرير */
        .card {
            opacity: 0.6;
            transform: scale(0.93) translateY(20px);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease, border-color 0.3s;
            background: rgba(18, 18, 22, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        /* الكلاس الذي تكتسبه البطاقة لما تكون في وسط الشاشة (تكبر وتبرز) */
        .card.active {
            opacity: 1;
            transform: scale(1.03) translateY(0);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            z-index: 10;
        }

        /* تأثير الـ Hover اليدوي لما تحط الماوس فوقها */
        .card:hover {
            transform: scale(1.05) translateY(-5px) !important;
            border-color: #ffffff;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
        }
        header h1 {
            font-size: 3rem;
            margin: 10px 0;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .subtitle {
            color: #aaa;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }
        
        /* شريط البحث المتمدد بسلاسة */
        .search-container {
            display: flex;
            justify-content: center;
            margin: 15px auto 0;
            padding: 0 20px;
        }
        .search-input {
            width: 45px;
            height: 45px;
            padding: 0 15px 0 45px;
            background: rgba(18, 18, 22, 0.95) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="%23ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>') no-repeat 14px center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            color: #fff;
            font-size: 15px;
            outline: none;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .search-input::placeholder {
            color: transparent;
            transition: color 0.3s ease;
        }
        .search-input:hover,
        .search-input:focus {
            width: 320px;
            cursor: text;
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        .search-input:hover::placeholder,
        .search-input:focus::placeholder {
            color: #777;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .back-link:hover {
            opacity: 1;
            text-decoration: underline;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }
        .card-image img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 10px;
        }
        .card h3 {
            font-size: 18px;
            margin: 15px 0 10px 0;
            color: #fff;
            letter-spacing: 1px;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            font-size: 14px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 12px;
        }
        .status {
            color: #2ecc71;
            font-weight: bold;
        }
        .claim-main-btn {
            display: block;
            text-align: center;
            background-color: transparent;
            color: #ffffff;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            width: 100%;
        }
        .claim-main-btn:hover {
            background-color: #ffffff;
            color: #030304;
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: rgba(18, 18, 22, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            position: relative;
        }
        .modal-content h2 {
            margin-top: 0;
            font-size: 20px;
            color: #fff;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            letter-spacing: 1px;
        }
        .info-label {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 4px;
        }
        .info-box {
            background: #0d0d0d;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #262626;
        }
        .info-box span {
            font-family: monospace;
            color: #fff;
            font-size: 14px;
            word-break: break-all;
        }
        .copy-btn {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .copy-btn:hover {
            background: #fff;
            color: #030304;
            border-color: #fff;
        }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
        }
        .close-modal:hover {
            color: #fff;
        }
        .modal-footer-ig {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 13px;
            color: #aaa;
        }
        .modal-footer-ig a {
            color: #fff;
            text-decoration: underline;
            font-weight: bold;
        }
        .modal-footer-ig a:hover {
            color: #38bdf8;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            border-top: 1px solid rgba(255,255,255,0.05);
            background: rgba(5, 5, 8, 0.9);
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-link">&larr; Back to Valhalla Home</a>
        <h1>STEAM DROPS</h1>
        <p class="subtitle">Exclusive game accounts and instant drops by Uzax.</p>
        
        <!-- شريط البحث المتمدد -->
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search game..." onkeyup="filterGames()">
        </div>
    </header>

    <div class="container">
        <div class="grid" id="cards-container"></div>
    </div>

    <!-- Modal -->
    <div class="modal" id="accountModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">&times;</button>
            <h2 id="modalGameTitle">Account Details</h2>
            
            <div>
                <div class="info-label">Username:</div>
                <div class="info-box">
                    <span id="modalUser"></span>
                    <button class="copy-btn" onclick="copyText('modalUser', this)">Copy</button>
                </div>
            </div>

            <div>
                <div class="info-label">Password:</div>
                <div class="info-box">
                    <span id="modalPass"></span>
                    <button class="copy-btn" onclick="copyText('modalPass', this)">Copy</button>
                </div>
            </div>

            <div class="modal-footer-ig">
                More drops? Visit Instagram: <a href="https://instagram.com/uzax.shop" target="_blank">@uzax.shop</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Valhalla Web - All Rights Reserved | Powered by Uzax</p>
    </footer>

    <script>
        const games = [
            { title: "SNIPER ELITE 4", appId: "312660", user: "steamboatcategory", pass: "yvuwm9cp8WTe" },
            { title: "CALL OF DUTY: MODERN WARFARE", appId: "1938090", user: "financialscorpion39551", pass: "n40saxt50yiyn4g!zru3b" },
            { title: "RESIDENT EVIL REQUIEM", appId: "2050650", user: "pkbwn28474", pass: "rwych85203" },
            { title: "RED DEAD REDEMPTION 2", appId: "1174180", user: "pamx36325", pass: "C4C45DCBXCKF" },
            { title: "CYBERPUNK 2077", appId: "1091500", user: "msk247542", pass: "rae246924" },
            { title: "FORZA HORIZON 5", appId: "1551360", user: "Vj7Iu0Ol3Nz6", pass: "Evylos12" },
            { title: "RESIDENT EVIL VILLAGE", appId: "1196590", user: "exqgy03440", pass: "2eZ9C3s9" },
            { title: "AGE OF EMPIRES II: DE", appId: "813780", user: "djw1040456792", pass: "NCDRxrBoin" },
            { title: "BODYCAM", appId: "2407270", user: "vvhlg39685", pass: "nfwz57148X" },
            { title: "Farming Simulator 22", appId: "1248130", user: "Rmzgff", pass: "Rmzgns1905" }
        ];

        const container = document.getElementById('cards-container');

        function renderGames(list) {
            container.innerHTML = '';
            if (list.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #777; grid-column: 1 / -1; font-size: 18px;">No games found matching your search.</p>';
                return;
            }
            list.forEach(game => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="card-image">
                            <img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/${game.appId}/header.jpg" alt="${game.title}">
                        </div>
                        <h3>${game.title}</h3>
                        <div class="status-bar">
                            <span style="color: #aaa; font-size: 13px;">Status:</span>
                            <span class="status">Available</span>
                        </div>
                    </div>
                    <button class="claim-main-btn" onclick="openModal('${game.title}', '${game.user}', '${game.pass}')">CLAIM NOW</button>
                `;
                container.appendChild(card);
            });

            // تفعيل نظام التركيز التلقائي للبطاقة في منتصف الشاشة (Active Scale on Scroll)
            setupScrollFocus();
        }

        renderGames(games);

        function setupScrollFocus() {
            const cards = document.querySelectorAll('.card');
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                    } else {
                        entry.target.classList.remove('active');
                    }
                });
            }, {
                root: null,
                rootMargin: '-20% 0px -20% 0px', // تفعل التركيز فقط لما تدخل البطاقة لمنتصف الشاشة
                threshold: 0.1
            });

            cards.forEach(card => observer.observe(card));
        }

        function filterGames() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = games.filter(game => game.title.toLowerCase().includes(query));
            renderGames(filtered);
        }

        function openModal(title, user, pass) {
            document.getElementById('modalGameTitle').innerText = title;
            document.getElementById('modalUser').innerText = user;
            document.getElementById('modalPass').innerText = pass;
            document.getElementById('accountModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('accountModal').style.display = 'none';
        }

        function copyText(elementId, btn) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.innerText;
                btn.innerText = 'Copied!';
                btn.style.borderColor = '#ffffff';
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.borderColor = 'rgba(255, 255, 255, 0.3)';
                }, 2000);
            });
        }

        window.onclick = function(event) {
            const modal = document.getElementById('accountModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }
    </script>

    <script src="script.js"></script>
</body>
</html>
